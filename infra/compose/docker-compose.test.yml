services:
  postgres-test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: truthsocialists_test
      POSTGRES_USER: truthsocialists
      POSTGRES_PASSWORD: local-integration-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthsocialists -d truthsocialists_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
